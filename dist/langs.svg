<svg xmlns="http://www.w3.org/2000/svg" width="430" height="173" viewBox="0 0 430 173">
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#7F00FF"/><stop offset=".5" stop-color="#E100FF"/><stop offset="1" stop-color="#00D4FF"/>
</linearGradient></defs>
<style>
.t{font:600 18px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif;fill:url(#g)} .l{font:400 14px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif;fill:#C9D1D9} .v{font:700 14px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif;fill:#00D4FF}
.row{opacity:0;animation:in .6s ease-out forwards} @keyframes in{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
